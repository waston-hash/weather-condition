name: Daily weather report
on:
  schedule:
    - cron: '0 13 * * *' # 21:00 China Standard Time
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-weather
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch forecast and write report
        run: python weather-daily.py
      - name: Commit latest forecast
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add weather.json weather-report.md
          git diff --cached --quiet || git commit -m "Update daily weather report"
          git push
